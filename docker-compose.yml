services:
    app:
        image: ghcr.io/tuor4eg/proletarka:latest
        restart: unless-stopped
        ports:
            - "127.0.0.1:3000:3000"
        environment:
            DATABASE_URL: ${DATABASE_URL}
            SESSION_SECRET: ${SESSION_SECRET}
            ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY}
            APP_URL: ${APP_URL}
            OUTBOUND_EVENTS_WEBHOOK_URL: ${OUTBOUND_EVENTS_WEBHOOK_URL}
            OUTBOUND_EVENTS_SECRET: ${OUTBOUND_EVENTS_SECRET}
            OUTBOUND_EVENTS_TIMEOUT_MS: ${OUTBOUND_EVENTS_TIMEOUT_MS:-3000}
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_REGION: ${S3_REGION}
            S3_BUCKET: ${S3_BUCKET}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
            S3_PUBLIC_URL: ${S3_PUBLIC_URL}
            SECURE_COOKIES: ${SECURE_COOKIES:-false}

    # Запускать явно перед деплоем: docker compose --profile migrate run --rm migrate
    migrate:
        build:
            context: .
            target: migrator
        command: npm run db:migrate
        environment:
            DATABASE_URL: ${DATABASE_URL}
        profiles: [migrate]

    # Только для локальной разработки. В продакшне не нужен.
    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000" # S3 API
            - "9001:9001" # Web-консоль: http://localhost:9001
        environment:
            MINIO_ROOT_USER: ${S3_ACCESS_KEY}
            MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
        volumes:
            - minio_data:/data
        profiles: [local]

volumes:
    minio_data:
